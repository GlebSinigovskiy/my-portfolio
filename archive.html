<script>

/* =====================================================
   PAGE TRANSITION
   ===================================================== */

const transition =
    document.querySelector(
        ".page-transition"
    );


function go(url, label) {

    if (!transition) {

        location.href = url;

        return;

    }


    transition.querySelector(
        "span"
    ).textContent = label;


    document.body.classList.add(
        "transition-in"
    );


    setTimeout(
        () => {
            location.href = url;
        },
        700
    );

}


document
    .querySelectorAll(
        'a[href$=".html"]'
    )
    .forEach(a => {

        a.addEventListener(
            "click",
            event => {

                const href =
                    a.getAttribute("href");


                if (
                    !href ||
                    href.startsWith("#") ||
                    a.target === "_blank"
                ) {
                    return;
                }


                event.preventDefault();


                go(
                    href,
                    href.includes("index")
                        ? "WORK"
                        : "ARCHIVE"
                );

            }
        );

    });


window.addEventListener(
    "pageshow",
    () => {

        requestAnimationFrame(
            () => {

                setTimeout(
                    () => {

                        document.body.classList.add(
                            "transition-out"
                        );

                    },
                    40
                );

            }
        );

    }
);


/* =====================================================
   RANDOM ORDER
   ===================================================== */

const grid =
    document.querySelector(
        ".archive-grid"
    );


const items =
    Array.from(
        grid.querySelectorAll(
            ".archive-item"
        )
    );


for (
    let i = items.length - 1;
    i > 0;
    i--
) {

    const j =
        Math.floor(
            Math.random() * (i + 1)
        );


    [
        items[i],
        items[j]
    ] = [
        items[j],
        items[i]
    ];

}


items.forEach(
    item => grid.appendChild(item)
);


/* =====================================================
   REMOVE MISSING IMAGES
   ===================================================== */

const validItems =
    Array.from(items);


validItems.forEach(
    item => {

        const image =
            item.querySelector("img");


        image.addEventListener(
            "error",
            () => {

                const index =
                    validItems.indexOf(item);


                if (index !== -1) {

                    validItems.splice(
                        index,
                        1
                    );

                }


                item.remove();

            }
        );

    }
);


/* =====================================================
   LIGHTBOX
   ===================================================== */

const lightbox =
    document.querySelector(
        ".lightbox"
    );


const lightboxImage =
    document.querySelector(
        ".lightbox-image"
    );


let currentIndex = 0;


function openLightbox(index) {

    if (!validItems.length) {
        return;
    }


    currentIndex =
        (
            index +
            validItems.length
        ) %
        validItems.length;


    const image =
        validItems[
            currentIndex
        ].querySelector("img");


    lightboxImage.src =
        image.src;


    lightbox.classList.add(
        "active"
    );


    document.body.style.overflow =
        "hidden";

}


function showNext() {

    openLightbox(
        currentIndex + 1
    );

}


function showPrevious() {

    openLightbox(
        currentIndex - 1
    );

}


grid.addEventListener(
    "click",
    event => {

        const item =
            event.target.closest(
                ".archive-item"
            );


        if (!item) {
            return;
        }


        const index =
            validItems.indexOf(
                item
            );


        if (index !== -1) {

            openLightbox(
                index
            );

        }

    }
);


document
    .querySelector(
        ".lightbox-next"
    )
    .addEventListener(
        "click",
        showNext
    );


document
    .querySelector(
        ".lightbox-prev"
    )
    .addEventListener(
        "click",
        showPrevious
    );


function closeLightbox() {

    lightbox.classList.remove(
        "active"
    );


    document.body.style.overflow =
        "";

}


document
    .querySelector(
        ".lightbox-close"
    )
    .addEventListener(
        "click",
        closeLightbox
    );


lightbox.addEventListener(
    "click",
    event => {

        if (
            event.target === lightbox
        ) {

            closeLightbox();

        }

    }
);


document.addEventListener(
    "keydown",
    event => {

        if (
            !lightbox.classList.contains(
                "active"
            )
        ) {
            return;
        }


        if (
            event.key === "ArrowRight"
        ) {

            showNext();

        }


        if (
            event.key === "ArrowLeft"
        ) {

            showPrevious();

        }


        if (
            event.key === "Escape"
        ) {

            closeLightbox();

        }

    }
);

</script>
