<script>
const transition = document.querySelector(".page-transition");

function go(url, label) {
    transition.querySelector("span").textContent = label;
    document.body.classList.add("transition-in");
    setTimeout(() => { location.href = url; }, 700);
}

document.querySelectorAll('a[href$=".html"]').forEach(a => {
    a.addEventListener("click", event => {
        const href = a.getAttribute("href");
        if (!href || a.target === "_blank") return;
        event.preventDefault();
        let label = "WORK";
        if (href.includes("project-")) {
            const match = href.match(/project-(\d+)/);
            label = match ? "PROJECT " + match[1] : "PROJECT";
        }
        go(href, label);
    });
});

window.addEventListener("pageshow", () => {
    requestAnimationFrame(() => {
        setTimeout(() => {
            document.body.classList.add("transition-out");
        }, 40);
    });
});
</script>
